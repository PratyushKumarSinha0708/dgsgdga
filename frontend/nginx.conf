server {
  listen 80;
  root /usr/share/nginx/html;

  location / { try_files $uri /index.html; }

  location /api/ {
    resolver 1.1.1.1 8.8.8.8 valid=30s;
    set $upstream https://dgsgdga-git-main-pratyushkumarsinha0708.vercel.app;
    proxy_pass $upstream;
    proxy_ssl_server_name on;
    proxy_set_header Host dgsgdga-git-main-pratyushkumarsinha0708.vercel.app;
    proxy_read_timeout 60s;
  }
}